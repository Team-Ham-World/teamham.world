name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

env:
  AUTH_MODE: disabled

jobs:
  validate:
    name: validate
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: neondb
          POSTGRES_USER: neondb_owner
          POSTGRES_PASSWORD: synthetic_ci_password_12345
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Preflight check (disabled mode)
        run: npm run preflight

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Run unit and mocked integration tests
        run: npx vitest run tests/unit tests/integration/oauth-flow.test.ts tests/integration/cache-headers.test.ts

      - name: Run PostgreSQL integration tests
        env:
          TEST_DATABASE_URL: postgres://neondb_owner:synthetic_ci_password_12345@127.0.0.1:5432/neondb
          ALLOW_LOCAL_DB_TESTS: "1"
        run: npx vitest run tests/integration/db-queries.test.ts

      - name: Run secret scanner
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Next.js application
        run: npm run build

      - name: Assert static root
        run: npx tsx scripts/assert-static-root.ts

      - name: Run disabled-mode HTTP smoke tests
        run: |
          LOG_FILE=$(mktemp)
          npm run start -- --port 3000 > "$LOG_FILE" 2>&1 &
          SERVER_PID=$!
          trap 'kill -TERM $SERVER_PID 2>/dev/null || true; wait $SERVER_PID 2>/dev/null || true; rm -f "$LOG_FILE"' EXIT

          if ! CI_BASE_URL="http://127.0.0.1:3000" npx tsx scripts/ci-smoke-disabled.ts; then
            echo "Smoke test failed. Server output:"
            cat "$LOG_FILE"
            exit 1
          fi
