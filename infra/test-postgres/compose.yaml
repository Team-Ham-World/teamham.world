name: teamham-test-postgres

services:
  postgres:
    image: postgres@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
    container_name: teamham-test-postgres
    hostname: teamham-test-postgres
    restart: unless-stopped
    env_file:
      - /root/.config/teamham/test-postgres.env
    command:
      - postgres
      - -c
      - max_connections=30
      - -c
      - shared_buffers=64MB
      - -c
      - password_encryption=scram-sha-256
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - test-data:/var/lib/postgresql/data
    shm_size: 64m
    mem_limit: 384m
    cpus: 1.0
    pids_limit: 128
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d teamham_test"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "2"
    labels:
      com.teamham.purpose: integration-tests

volumes:
  test-data:
    name: teamham-test-postgres-data
    external: true
