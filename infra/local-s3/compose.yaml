name: teamham-local-s3

services:
  minio:
    image: quay.io/minio/minio@sha256:d249d1fb6966de4d8ad26c04754b545205ff15a62e4fd19ebd0f26fa5baacbc0
    container_name: teamham-local-s3
    command: server /data --console-address :9001
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: teamhamlocalaccess
      MINIO_ROOT_PASSWORD: teamham-local-secret-key-12345678901234567890
      MINIO_SITE_REGION: us-east-1
      MINIO_API_CORS_ALLOW_ORIGIN: https://localhost:3000,https://127.0.0.1:3000
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - ./data:/data
      - ../../certificates/localhost.pem:/root/.minio/certs/public.crt:ro
      - ../../certificates/localhost-key.pem:/root/.minio/certs/private.key:ro
    healthcheck:
      test: ["CMD", "curl", "-fk", "https://localhost:9000/minio/health/live"]
      interval: 2s
      timeout: 2s
      retries: 30
      start_period: 5s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "2"

  bootstrap:
    image: minio/mc@sha256:a7fe349ef4bd8521fb8497f55c6042871b2ae640607cf99d9bede5e9bdf11727
    profiles: ["bootstrap"]
    depends_on:
      minio:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -c
      - |
        mc alias set local https://minio:9000 teamhamlocalaccess teamham-local-secret-key-12345678901234567890 --api S3v4 --insecure
        mc mb local/teamham-member-assets-local --ignore-existing --insecure
        mc anonymous set none local/teamham-member-assets-local --insecure
